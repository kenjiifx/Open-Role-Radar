name: Sync Simplify Feeds

# Deprecated in favor of sync-fast.yml (public ATS APIs every 5 minutes).
# Kept as a thin alias so existing bookmarks / dispatch still work.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openroleradar-sync-fast
  cancel-in-progress: true

jobs:
  redirect:
    name: Run Sync Fast Path instead
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync Fast Path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Sync Fast Path" --repo "${GITHUB_REPOSITORY}"
          echo "Dispatched Sync Fast Path (greenhouse+lever+ashby+simplify every 5m)."
