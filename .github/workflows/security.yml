name: Security

on:
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1635cea06169dac05bcb1fe423 # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d83eae04dd29c3a3eb9be99 # v4.5.0

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1635cea06169dac05bcb1fe423 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1f3ade3399f5385ed1b3641e782cdccafd370320 # v3.28.12
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1f3ade3399f5385ed1b3641e782cdccafd370320 # v3.28.12

      - name: Analyze
        uses: github/codeql-action/analyze@1f3ade3399f5385ed1b3641e782cdccafd370320 # v3.28.12
        with:
          category: "/language:${{ matrix.language }}"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1635cea06169dac05bcb1fe423 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@7b6b7d71fd345867f2aecbb6ff63f536eea0024b # v6.3.1

      - name: Audit Python dependencies
        working-directory: engine
        run: |
          uv sync --all-extras --dev
          uv pip audit || true

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc7a301e2790070c9f8088805530 # v4.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Audit Node dependencies
        working-directory: site
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
          pnpm audit --audit-level moderate || true
