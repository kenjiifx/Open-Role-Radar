# Copy this file into your own repository as .github/workflows/openroleradar-watch.yml
# and customize the filters below. See templates/user-watch/README.md for setup.
#
# This template is NOT executed in the OpenRoleRadar repository.

name: OpenRoleRadar Watch (template)

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check for matching roles
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public feed
        id: feed
        run: |
          FEED_URL="${FEED_URL:-https://kenjiifx.github.io/Open-Role-Radar/feeds/early-career.atom}"
          curl -fsSL "$FEED_URL" -o feed.atom
          echo "Fetched $(wc -c < feed.atom) bytes from $FEED_URL"

      - name: Filter matches
        env:
          KEYWORDS: ${{ vars.ORR_KEYWORDS || 'intern,new grad,graduate' }}
          LOCATIONS: ${{ vars.ORR_LOCATIONS || '' }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {"a": "http://www.w3.org/2005/Atom"}
          root = ET.parse("feed.atom").getroot()
          keywords = [k.strip().lower() for k in os.environ.get("KEYWORDS", "").split(",") if k.strip()]
          locations = [l.strip().lower() for l in os.environ.get("LOCATIONS", "").split(",") if l.strip()]
          matches = []
          for entry in root.findall("a:entry", ns):
              title = (entry.findtext("a:title", default="", namespaces=ns) or "").lower()
              summary = (entry.findtext("a:summary", default="", namespaces=ns) or "").lower()
              link = entry.find("a:link", ns)
              href = link.get("href") if link is not None else ""
              blob = f"{title} {summary}"
              if keywords and not any(k in blob for k in keywords):
                  continue
              if locations and not any(l in blob for l in locations):
                  continue
              matches.append((entry.findtext("a:title", default="", namespaces=ns), href))
          Path("matches.txt").write_text("\n".join(f"{t} | {u}" for t, u in matches), encoding="utf-8")
          print(f"Matched {len(matches)} roles")
          PY

      - name: Open issue on new matches
        if: hashFiles('matches.txt') != ''
        uses: actions/github-script@60a0d83039c77a4a574a02a50933bc6b2457f661 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('matches.txt', 'utf8');
            if (!body.trim()) return;
            const title = `OpenRoleRadar: ${body.split('\n').length} matching role(s)`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'Automated watch results from the public OpenRoleRadar feed.',
                '',
                '```',
                body,
                '```',
                '',
                '_Generated by the OpenRoleRadar user-watch template._'
              ].join('\n'),
              labels: ['openroleradar-watch']
            });
