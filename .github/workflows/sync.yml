name: Sync and Deploy

on:
  schedule:
    # Every 15 minutes, offset from the hour to reduce GitHub Actions queue contention.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: Sync only a small sample of sources
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: openroleradar-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync, build, and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync Python dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Run sync
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.sample }}" = "true" ]; then
            uv run openroleradar sync --sample
          else
            uv run openroleradar sync
          fi

      - name: Build data exports
        working-directory: engine
        run: uv run openroleradar build-data

      - name: Publish durable live-state release
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run openroleradar publish-state

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Build site
        working-directory: site
        env:
          ASTRO_BASE: /Open-Role-Radar/
          ASTRO_SITE: https://kenjiifx.github.io
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
          pnpm build

      - name: Save live state
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
