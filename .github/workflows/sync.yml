name: Sync and Deploy

on:
  schedule:
    # Every 15 minutes, offset from the hour to reduce GitHub Actions queue contention.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: Sync only a small sample of sources
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openroleradar-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync, build, and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1635cea06169dac05bcb1fe423 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@7b6b7d71fd345867f2aecbb6ff63f536eea0024b # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync Python dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@7a6bd7af641a0165805d177f9339a6e8acad65b9 # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Run sync
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.sample }}" = "true" ]; then
            uv run openroleradar sync --sample
          else
            uv run openroleradar sync
          fi

      - name: Build data exports
        working-directory: engine
        run: uv run openroleradar build-data

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc7a301e2790070c9f8088805530 # v4.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Build site
        working-directory: site
        env:
          ASTRO_BASE: /Open-Role-Radar/
          ASTRO_SITE: https://kenjiifx.github.io
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
          pnpm build

      - name: Save live state
        uses: actions/cache/save@7a6bd7af641a0165805d177f9339a6e8acad65b9 # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc484603a0243718a965a8aeb4930571f69ac # v3.0.1
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed628f0dc7b9e163f97694cb3ed # v4.0.5
