name: Broken source
description: Report a seed or discovered source that fails to sync
title: "source-health: "
labels:
  - source
  - broken-source
  - needs-triage
body:
  - type: input
    id: company
    attributes:
      label: Company name
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: company.com
    validations:
      required: true

  - type: input
    id: source_id
    attributes:
      label: Source ID (if known)

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - HTTP errors (4xx/5xx)
        - Empty board / no jobs returned
        - Wrong ATS detected
        - Redirects to aggregator
        - Rate limited / blocked
        - Parser regression
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: When did it break? Any error messages from sync logs?
    validations:
      required: true

  - type: input
    id: careers_url
    attributes:
      label: Current careers URL
    validations:
      required: false

  - type: checkboxes
    id: action
    attributes:
      label: Suggested action
      options:
        - label: Disable source until fixed
        - label: Update adapter/tenant in sources.yml
        - label: Remove from seed list
